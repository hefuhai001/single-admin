spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:db_single_admin}?serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:single_admin}
    password: ${MYSQL_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE:0}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 200
          max-idle: 10
          min-idle: 0
  mail:
    protocol: smtps
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          ssl:
            enable: true
          starttls:
            enable: true
        debug: false

# 生产环境关闭接口文档，避免暴露完整接口清单
knife4j:
  enable: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# 生产环境不输出 SQL 调试日志；日志以 JSON 输出到 stdout（含 MDC 中的 traceId），便于 Loki/ELK 采集
logging:
  structured:
    format:
      console: logstash
  level:
    root: INFO
    com.hfh: INFO
    org.apache.ibatis: WARN
