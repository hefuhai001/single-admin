server:
  # 端口统一由 SERVER_PORT 控制：本地默认 9999，容器内由 docker-compose 注入 8080
  port: ${SERVER_PORT:9999}
  # 优雅停机：等待在途请求处理完成后再退出
  shutdown: graceful
  undertow:
    io-threads: ${UNDERTOW_IO_THREADS:4} # IO 线程数，默认为 CPU 核心数
    worker-threads: ${UNDERTOW_WORKER_THREADS:20}  # 工作线程数
    buffer-size: 1024 # 缓冲区大小（字节）
    direct-buffers: true  # 是否分配直接内存（NIO 使用）
    max-http-post-size: 10MB  # 最大 HTTP POST 大小
spring:
  profiles:
    active: dev
  application:
    name: backend
  # 优雅停机等待时间
  lifecycle:
    timeout-per-shutdown-phase: 30s
  # 数据源连接池公共参数，各 profile 可按需覆盖
  datasource:
    hikari:
      pool-name: single-admin-pool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:5000}
  # 本地开发时从 backend/.env 读取数据库、Redis 凭据（文件不存在时忽略）
  config:
    import: optional:file:.env[.properties]
  # 数据库版本迁移：表结构与初始化数据由 db/migration 下的 Flyway 脚本维护
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-date-keys-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 30MB
      file-size-threshold: 2KB
      location: /tmp
      resolve-lazily: false
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=10000,expireAfterWrite=600s
  task:
    execution:
      pool:
        core-size: 8
        max-size: 16
        queue-capacity: 100
        keep-alive: 60s
      thread-name-prefix: async-task-
    scheduling:
      pool:
        size: 4
      thread-name-prefix: scheduling-

sa-token:
  token-name: Authorization     # 前端携带 token 的 header / param 名称
  timeout: 7200             # accessToken 有效时间(秒) 2小时
  is-share: true           # 允许同一账号多 token（双 token 模式需要）
  is-read-header: true      # 支持从 header 读取 token
  is-read-cookie: false     # 不从 cookie 读取（前后端分离架构）
  is-log: false
  token-style: uuid   # uuid simple-uuid random-32 random-64 random-128 tik
  active-timeout: -1  # min-active
  is-concurrent: true  # 允许多 token 共存（双 token 模式需要），SSO 由登录逻辑手动踢旧会话实现
  token-prefix: Bearer     # 前端提交 token 时的前缀

mybatis-plus:
  mapper-locations: classpath:mapper/*/*.xml
  global-config:
    db-config:
      table-prefix:
      id-type: auto
      insert-strategy: not_null
      update-strategy: not_null

knife4j:
  enable: true
  setting:
    language: zh_cn
    enable-footer-custom: true
    footer-custom-content: "Apache License 2.0 | Copyright xiao he like sleep"
  basic:
    enable: false
    username: 1
    password: 1

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: order
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  # 日志统一输出到 stdout，由容器/采集端（如 Loki、ELK）负责落盘与聚合；
  # 生产环境通过 application-prod.yaml 开启结构化 JSON 格式。
  level:
    com.hfh: INFO
    org.springframework: INFO
    org.apache.ibatis: INFO
