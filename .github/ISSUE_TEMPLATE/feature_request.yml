name: 功能请求
description: 提出一个新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先搜索现有 Issue，确认没有相同的建议。描述越具体，越容易被评估和实现。

  - type: textarea
    id: background
    attributes:
      label: 使用场景
      description: 你遇到了什么问题？这个功能能解决什么实际需求？
      placeholder: 例如：多机构场景下，希望用户只能看到本机构的数据
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
      description: 你希望它如何工作？可以描述交互、接口或数据结构
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过哪些替代做法？

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      multiple: true
      options:
        - 后端接口
        - 前端页面
        - 数据库结构
        - 部署与配置
        - 文档
        - 不确定

  - type: checkboxes
    id: contribution
    attributes:
      label: 参与意愿
      options:
        - label: 我愿意提交 Pull Request 实现这个功能
