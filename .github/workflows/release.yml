name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '发布版本号，如 v1.0.0'
        required: true
        type: string

permissions:
  contents: write
  packages: write

# 回滚策略：
# 1. 镜像：compose 通过 VERSION 指定版本（默认 latest），每个发布版本都会保留独立 tag。
#    回滚时把 VERSION 改成上一个 tag，执行 docker compose up -d 即可。
# 2. 数据库：Flyway 社区版不支持自动回滚。包含迁移脚本的发布必须提前备份 MySQL，
#    并准备逆向脚本；回滚时先在备份上验证，再人工执行逆向脚本。
# 3. 发布前先在预发布环境验证镜像与迁移脚本，确认无误后再打 tag。

jobs:
  release:
    name: Build images and create release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${INPUT_TAG:-$REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9] ]]; then
            echo "版本号必须以 v 开头，如 v1.0.0：$TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate changelog
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${TAG}$" | head -n 1 || true)
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
          else
            RANGE="HEAD"
          fi
          {
            echo "## ${TAG}"
            echo
            echo "对比范围：${PREV_TAG:-首次发布}"
            echo
            git log --pretty=format:'- %s (%h)' "$RANGE"
            echo
          } > release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" --title "Release $TAG" --notes-file release-notes.md
