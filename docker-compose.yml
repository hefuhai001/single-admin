services:
  mysql:
    image: mysql:8.0.45
    container_name: vd-mysql
    ports:
      - "${MYSQL_PORT}:3306"
    environment:
      TZ: ${TZ}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中配置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-db_single_admin}
    volumes:
      - mysql_data:/var/lib/mysql
      # 表结构与初始化数据由后端启动时的 Flyway（backend/src/main/resources/db/migration）创建
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=${MYSQL_CHARACTER_SET:-utf8mb4}
      --collation-server=${MYSQL_COLLATION:-utf8mb4_unicode_ci}
      --default-time-zone=${MYSQL_DEFAULT_TIME_ZONE:-+8:00}
      --max-connections=${MYSQL_MAX_CONNECTIONS:-500}
      --wait-timeout=${MYSQL_WAIT_TIMEOUT:-28800}
      --innodb-buffer-pool-size=${MYSQL_INNODB_BUFFER_POOL_SIZE:-1G}
      --innodb-log-file-size=${MYSQL_INNODB_LOG_FILE_SIZE:-512M}
      --sql-mode=${MYSQL_SQL_MODE:-STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION}
    restart: unless-stopped
    networks:
      - webnet
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # docker compose（非 Swarm）使用 cpus / mem_limit 限制资源，deploy.resources 不生效
    cpus: 1
    mem_limit: 1g
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:8.4.0-alpine
    container_name: vd-redis
    ports:
      - "${REDIS_PORT}:6379"
    environment:
      TZ: ${TZ}
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?请在 .env 中配置 REDIS_PASSWORD}
      --save ${REDIS_SAVE_900:-900} ${REDIS_SAVE_900_VALUE:-1}
      --save ${REDIS_SAVE_300:-300} ${REDIS_SAVE_300_VALUE:-10}
      --save ${REDIS_SAVE_60:-60} ${REDIS_SAVE_60_VALUE:-10000}
      --dbfilename ${REDIS_DBFILENAME:-dump.rdb}
      --appendonly ${REDIS_APPENDONLY:-yes}
      --appendfilename ${REDIS_APPENDFILENAME:-appendonly.aof}
      --appendfsync ${REDIS_APPENDFSYNC:-everysec}
      --maxmemory ${REDIS_MAXMEMORY:-256mb}
      --maxmemory-policy ${REDIS_MAXMEMORY_POLICY:-allkeys-lru}
    restart: unless-stopped
    networks:
      - webnet
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?请在 .env 中配置 REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    cpus: 0.5
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: vd-minio
    ports:
      - "${MINIO_PORT}:9000"
      - "${FILES_PORT}:9001"
    environment:
      TZ: ${TZ}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?请在 .env 中配置 MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?请在 .env 中配置 MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data --address ${MINIO_ADDRESS:-:9000} --console-address ${MINIO_CONSOLE_ADDRESS:-:9001}
    restart: unless-stopped
    networks:
      - webnet
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    cpus: 1
    mem_limit: 1g
    security_opt:
      - no-new-privileges:true

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        - BUILD_ENV=production
    image: vd-backend:${VERSION:-latest}
    container_name: vd-backend
    ports:
      - "${BACKEND_PORT}:8080"
    environment:
      TZ: ${TZ}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      # 容器内监听 8080，与 Dockerfile/healthcheck/nginx 保持一致
      SERVER_PORT: 8080
      # 凭据由根目录 .env 注入，不在仓库中保留明文
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-db_single_admin}
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中配置 MYSQL_ROOT_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请在 .env 中配置 REDIS_PASSWORD}
      JAVA_OPTS: ${JAVA_OPTS:--XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0}
    restart: unless-stopped
    networks:
      - webnet
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    cpus: 2
    mem_limit: 2g
    security_opt:
      - no-new-privileges:true
    read_only: false

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - BUILD_ENV=production
    image: vd-frontend:${VERSION:-latest}
    container_name: vd-frontend
    ports:
      - "${FRONTEND_PORT}:80"
    environment:
      TZ: ${TZ}
    volumes:
      - ./frontend/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    networks:
      - webnet
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    cpus: 0.5
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  webnet:
    driver: bridge
